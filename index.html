<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錯題筆記上傳助手 (PDF 合併版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- jsPDF CDN for Client-Side PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .cropper-view-box, .cropper-face { border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span>📸</span> 錯題上傳助手
            </h1>
            <div class="flex items-center gap-2">
                <span id="user-status" class="text-xs bg-indigo-700 px-2 py-1 rounded-full text-indigo-200">未登入</span>
                <button onclick="openSettings()" class="p-2 rounded-full hover:bg-indigo-500 transition text-lg" title="設定">⚙️</button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 py-4 flex-1 flex flex-col w-full">

        <!-- 未登入提示區 -->
        <div id="login-container" class="my-auto text-center p-6 bg-white rounded-2xl shadow-sm border border-slate-100">
            <div class="text-5xl mb-4">🔐</div>
            <h2 class="text-xl font-bold mb-2">請先登入 Google 帳號</h2>
            <p class="text-sm text-slate-500 mb-6">登入後才能將錯題照片自動打包 PDF 歸檔至您的 Google 雲端硬碟，供 NotebookLM 使用。</p>
            
            <button onclick="requestGoogleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M21.35 11.1H12v3.8h5.4c-.2 1.2-1 2.2-2.1 2.9v2.5h3.4c2-1.8 3.1-4.6 3.1-8.2 0-.6-.1-1.2-.1-1Phz"/>
                    <path d="M12 21c2.8 0 5.2-.9 7-2.6l-3.4-2.5c-.9.6-2.1 1-3.6 1-2.8 0-5.2-1.9-6-4.4H2.4v2.6C4.2 18.7 7.8 21 12 21z"/>
                    <path d="M6 12.5c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V5.9H2.4C1.5 7.7 1 9.8 1 12s.5 4.3 1.4 6.1l3.6-2.6z"/>
                    <path d="M12 5.9c1.5 0 2.9.5 4 1.5l3-3C17.2 2.7 14.8 1.8 12 1.8 7.8 1.8 4.2 4.1 2.4 7.7l3.6 2.8c.8-2.5 3.2-4.6 6-4.6z"/>
                </svg>
                使用 Google 帳號登入
            </button>
        </div>

        <!-- 已登入：主操作介面 -->
        <div id="app-container" class="hidden flex-1 flex flex-col">
            
            <!-- 目前設定摘要橫幅 -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3.5 mb-4 flex justify-between items-center shadow-xs">
                <div>
                    <div class="text-xs text-indigo-500 font-medium">目前歸檔位置</div>
                    <div id="current-setting-text" class="text-sm font-bold text-indigo-900 mt-0.5">國一上學期 · 第一次段考</div>
                </div>
                <button onclick="openSettings()" class="text-xs bg-white text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-lg font-medium shadow-2xs active:scale-95 transition">
                    更改設定
                </button>
            </div>

            <!-- 科目選擇標題 -->
            <div class="mb-3">
                <h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">第一步：選擇拍照科目</h2>
            </div>

            <!-- 科目按鈕網格 -->
            <div id="subject-grid" class="grid grid-cols-2 gap-3 mb-6">
                <!-- 動態生成科目按鈕 -->
            </div>

            <!-- 待合併錯題佇列區 -->
            <div id="queue-section" class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm mt-auto">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <span>📄</span> 待打包錯題清單 
                        <span id="queue-count" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-bold">0 題</span>
                    </h3>
                    <button onclick="clearQueue()" id="clear-btn" class="text-xs text-red-500 hover:text-red-700 hidden">清空</button>
                </div>

                <!-- 縮圖預覽清單 -->
                <div id="queue-list" class="flex gap-2 overflow-x-auto py-2 min-h-[70px] items-center">
                    <p id="empty-queue-msg" class="text-xs text-slate-400 text-center w-full py-4">尚無題目，請點擊上方科目開始拍照裁切</p>
                </div>

                <!-- 打包 PDF 並上傳按鈕 -->
                <button onclick="generatePdfAndUpload()" id="upload-pdf-btn" disabled class="w-full mt-3 bg-slate-300 text-slate-500 font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-not-allowed">
                    <span>🚀</span> 打包為單一 PDF 並歸檔至雲端
                </button>
            </div>

            <!-- 隱藏的拍照 Input -->
            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageCapture(event)">
        </div>

    </main>

    <!-- 圖片裁切彈窗 Modal -->
    <div id="cropper-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4">
        <div class="text-white text-center font-bold text-sm py-2">調整錯題範圍與裁切</div>
        <div class="flex-1 relative overflow-hidden flex items-center justify-center my-2">
            <img id="cropper-image" class="max-h-full max-w-full block">
        </div>
        <div class="flex gap-3 pt-2">
            <button onclick="closeCropper()" class="flex-1 bg-slate-700 text-white py-3 rounded-xl font-medium active:scale-98 transition">取消</button>
            <button onclick="addCroppedImageToQueue()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-medium active:scale-98 transition shadow-lg shadow-indigo-600/30">加入 PDF 清單</button>
        </div>
    </div>

    <!-- 設定彈窗 Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">歸檔階段與年級設定</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年級選擇</label>
                    <select id="setting-grade" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 bg-white">
                        <option value="國一">國一</option>
                        <option value="國二">國二</option>
                        <option value="國三">國三</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">學期選擇</label>
                    <select id="setting-semester" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 bg-white">
                        <option value="上學期">上學期</option>
                        <option value="下學期">下學期</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">段考階段</label>
                    <select id="setting-exam" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 bg-white">
                        <option value="第一次段考">第一次段考</option>
                        <option value="第二次段考">第二次段考</option>
                        <option value="第三次段考">第三次段考</option>
                        <option value="平時測驗">平時測驗</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex gap-2">
                <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium shadow-md shadow-indigo-600/20 active:scale-98 transition">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 全局 Loading 遮罩 -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center text-white px-6">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent mb-3"></div>
        <div id="loading-text" class="text-sm font-medium text-center">正在處理中...</div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const HARDCODED_CLIENT_ID = '896748643603-1fa22anpr0brr7vr5jd47ub0cv36n2mk.apps.googleusercontent.com';
        const UPLOAD_TIMEOUT_MS = 20000; // PDF 上傳超時判定設為 20 秒

        const SUBJECTS = {
            "國一": ["國文", "英文", "數學", "生物", "歷史", "地理", "公民"],
            "國二": ["國文", "英文", "數學", "理化", "歷史", "地理", "公民"],
            "國三": ["國文", "英文", "數學", "理化", "歷史", "地理", "公民"]
        };

        let accessToken = null;
        let tokenClient = null;
        let cropper = null;
        let selectedSubject = '';
        
        // 待打包圖片佇列 [{ subject: '數學', blob: Blob, dataUrl: 'data:image...' }]
        let croppedQueue = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadSettingsToUI();
            initGoogleOAuth();
        });

        function initGoogleOAuth() {
            if (window.google && window.google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: HARDCODED_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    callback: (resp) => {
                        if (resp.error) {
                            showErrorMessage('Google 登入授權失敗', resp.error);
                            return;
                        }
                        accessToken = resp.access_token;
                        document.getElementById('user-status').innerText = '已連線';
                        document.getElementById('user-status').className = 'text-xs bg-emerald-600 px-2 py-1 rounded-full text-emerald-100';
                        document.getElementById('login-container').classList.add('hidden');
                        document.getElementById('app-container').classList.remove('hidden');
                        renderSubjects();
                    }
                });
            } else {
                setTimeout(initGoogleOAuth, 200);
            }
        }

        function requestGoogleLogin() {
            if (tokenClient) {
                tokenClient.requestAccessToken();
            } else {
                alert('Google API 載入中，請稍後再試');
            }
        }

        function openSettings() {
            loadSettingsToUI();
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function loadSettingsToUI() {
            document.getElementById('setting-grade').value = localStorage.getItem('setting_grade') || '國一';
            document.getElementById('setting-semester').value = localStorage.getItem('setting_semester') || '上學期';
            document.getElementById('setting-exam').value = localStorage.getItem('setting_exam') || '第一次段考';
            updateCurrentSettingDisplay();
        }

        function saveSettings() {
            const grade = document.getElementById('setting-grade').value;
            const semester = document.getElementById('setting-semester').value;
            const exam = document.getElementById('setting-exam').value;

            localStorage.setItem('setting_grade', grade);
            localStorage.setItem('setting_semester', semester);
            localStorage.setItem('setting_exam', exam);

            updateCurrentSettingDisplay();
            closeSettings();
            if (accessToken) {
                renderSubjects();
            }
        }

        function updateCurrentSettingDisplay() {
            const grade = localStorage.getItem('setting_grade') || '國一';
            const semester = localStorage.getItem('setting_semester') || '上學期';
            const exam = localStorage.getItem('setting_exam') || '第一次段考';
            document.getElementById('current-setting-text').innerText = `${grade}${semester} · ${exam}`;
        }

        function renderSubjects() {
            const grade = localStorage.getItem('setting_grade') || '國一';
            const subjects = SUBJECTS[grade] || SUBJECTS["國一"];
            const grid = document.getElementById('subject-grid');
            grid.innerHTML = '';

            subjects.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/30 rounded-xl p-4 flex flex-col items-center justify-center shadow-xs active:scale-95 transition group';
                btn.innerHTML = `
                    <span class="text-2xl mb-1 group-hover:scale-110 transition">📚</span>
                    <span class="text-base font-bold text-slate-700 group-hover:text-indigo-600">${sub}</span>
                `;
                btn.onclick = () => selectSubjectAndCapture(sub);
                grid.appendChild(btn);
            });
        }

        function selectSubjectAndCapture(sub) {
            selectedSubject = sub;
            document.getElementById('camera-input').click();
        }

        function handleImageCapture(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading('正在讀取照片...');

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = new Image();
                imgElement.onload = function() {
                    const MAX_SIZE = 1200;
                    let width = imgElement.width;
                    let height = imgElement.height;

                    if (width > MAX_SIZE || height > MAX_SIZE) {
                        if (width > height) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        } else {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imgElement, 0, 0, width, height);

                    const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                    const img = document.getElementById('cropper-image');
                    img.src = resizedDataUrl;
                    hideLoading();
                    document.getElementById('cropper-modal').classList.remove('hidden');
                    
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(img, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        autoCropArea: 0.9,
                        responsive: true
                    });
                };
                imgElement.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function closeCropper() {
            document.getElementById('cropper-modal').classList.add('hidden');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        // 將裁切後的照片加入待打包佇列
        function addCroppedImageToQueue() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
            if (!canvas) {
                alert('無法取得裁切畫布，請重新裁切');
                return;
            }

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            croppedQueue.push({
                subject: selectedSubject,
                dataUrl: dataUrl,
                width: canvas.width,
                height: canvas.height
            });

            closeCropper();
            updateQueueUI();
        }

        // 更新佇列顯示介面
        function updateQueueUI() {
            const queueList = document.getElementById('queue-list');
            const queueCount = document.getElementById('queue-count');
            const clearBtn = document.getElementById('clear-btn');
            const uploadBtn = document.getElementById('upload-pdf-btn');

            queueCount.innerText = `${croppedQueue.length} 題`;

            if (croppedQueue.length === 0) {
                queueList.innerHTML = '<p id="empty-queue-msg" class="text-xs text-slate-400 text-center w-full py-4">尚無題目，請點擊上方科目開始拍照裁切</p>';
                clearBtn.classList.add('hidden');
                uploadBtn.disabled = true;
                uploadBtn.className = 'w-full mt-3 bg-slate-300 text-slate-500 font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-not-allowed';
            } else {
                queueList.innerHTML = '';
                croppedQueue.forEach((item, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'relative flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border border-slate-200 shadow-xs group';
                    itemDiv.innerHTML = `
                        <img src="${item.dataUrl}" class="w-full h-full object-cover">
                        <span class="absolute bottom-0 inset-x-0 bg-indigo-600/80 text-white text-[10px] text-center py-0.5 truncate px-1">${item.subject}</span>
                        <button onclick="removeFromQueue(${index})" class="absolute top-0.5 right-0.5 bg-red-600 text-white w-4 h-4 rounded-full text-[10px] flex items-center justify-center shadow-md">✕</button>
                    `;
                    queueList.appendChild(itemDiv);
                });

                clearBtn.classList.remove('hidden');
                uploadBtn.disabled = false;
                uploadBtn.className = 'w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md shadow-indigo-600/30 transition flex items-center justify-center gap-2 active:scale-98';
            }
        }

        function removeFromQueue(index) {
            croppedQueue.splice(index, 1);
            updateQueueUI();
        }

        function clearQueue() {
            if (confirm('確定要清空所有已拍錯題嗎？')) {
                croppedQueue = [];
                updateQueueUI();
            }
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = UPLOAD_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                if (err.name === 'AbortError') {
                    throw new Error(`請求逾時 (超過 ${timeoutMs/1000} 秒無回應)，請檢查網路或重新登入`);
                }
                throw err;
            }
        }

        // 打包前端所有圖片為多頁高解析度 PDF 並發送至 Google Drive
        async function generatePdfAndUpload() {
            if (croppedQueue.length === 0) return;

            showLoading(`正在打包 ${croppedQueue.length} 道錯題為 PDF...`);

            try {
                const { jsPDF } = window.jspdf;
                // 初始化 A4 尺寸 (210mm x 297mm) PDF
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = 210;
                const pdfHeight = 297;
                const margin = 10;
                const printableWidth = pdfWidth - (margin * 2);
                const printableHeight = pdfHeight - (margin * 2);

                croppedQueue.forEach((item, index) => {
                    if (index > 0) {
                        pdf.addPage();
                    }

                    // 計算等比例圖片大小，確保滿版清晰且不變形
                    let imgWidth = printableWidth;
                    let imgHeight = (item.height * printableWidth) / item.width;

                    if (imgHeight > printableHeight) {
                        imgHeight = printableHeight;
                        imgWidth = (item.width * printableHeight) / item.height;
                    }

                    const xPos = margin + (printableWidth - imgWidth) / 2;
                    const yPos = margin + (printableHeight - imgHeight) / 2;

                    pdf.addImage(item.dataUrl, 'JPEG', xPos, yPos, imgWidth, imgHeight);
                    
                    // 頁尾小字註記
                    pdf.setFontSize(9);
                    pdf.setTextColor(150);
                    pdf.text(`錯題筆記 - 科目: ${item.subject} | 第 ${index + 1} / ${croppedQueue.length} 頁`, margin, pdfHeight - 4);
                });

                // 生成 PDF Blob
                const pdfBlob = pdf.output('blob');

                const grade = localStorage.getItem('setting_grade') || '國一';
                const semester = localStorage.getItem('setting_semester') || '上學期';
                const exam = localStorage.getItem('setting_exam') || '第一次段考';

                // 以第一張題目的科目為主，若有多科目則標註為「綜合」
                const mainSubject = croppedQueue.every(i => i.subject === croppedQueue[0].subject) ? croppedQueue[0].subject : '綜合';

                showLoading('正在檢查/建立根資料夾...');
                const rootFolderId = await getOrCreateFolder('NotebookLM_錯題本', 'root');
                
                showLoading('正在檢查/建立年級資料夾...');
                const gradeFolderId = await getOrCreateFolder(`${grade}${semester}`, rootFolderId);
                
                showLoading('正在檢查/建立段考資料夾...');
                const examFolderId = await getOrCreateFolder(exam, gradeFolderId);
                
                showLoading('正在檢查/建立科目資料夾...');
                const subjectFolderId = await getOrCreateFolder(mainSubject, examFolderId);

                showLoading('正在傳送錯題本 PDF 至 Google 雲端...');
                const timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
                const fileName = `${mainSubject}_錯題合輯_${timestamp}.pdf`;
                
                const metadata = {
                    name: fileName,
                    mimeType: 'application/pdf',
                    parents: [subjectFolderId]
                };

                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', pdfBlob);

                const response = await fetchWithTimeout('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`PDF 上傳失敗 [HTTP ${response.status}]: ${errText}`);
                }

                hideLoading();
                alert(`🎉 成功將 ${croppedQueue.length} 道錯題打包上傳為 PDF！\n已歸檔至 [${mainSubject}] 資料夾。`);
                
                // 清空佇列
                croppedQueue = [];
                updateQueueUI();

            } catch (error) {
                hideLoading();
                console.error('PDF Upload Error Detailed:', error);
                showErrorMessage('PDF 打包或上傳失敗', error.message || error);
            }
        }

        async function getOrCreateFolder(folderName, parentId) {
            const query = `name='${folderName}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
            
            const searchRes = await fetchWithTimeout(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });

            if (!searchRes.ok) {
                const errText = await searchRes.text();
                throw new Error(`搜尋資料夾 [${folderName}] 失敗 [HTTP ${searchRes.status}]: ${errText}`);
            }

            const searchData = await searchRes.json();
            if (searchData.files && searchData.files.length > 0) {
                return searchData.files[0].id;
            }

            const metadata = {
                name: folderName,
                mimeType: 'application/vnd.google-apps.folder',
                parents: [parentId]
            };
            const createRes = await fetchWithTimeout('https://www.googleapis.com/drive/v3/files', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(metadata)
            });

            if (!createRes.ok) {
                const errText = await createRes.text();
                throw new Error(`建立資料夾 [${folderName}] 失敗 [HTTP ${createRes.status}]: ${errText}`);
            }

            const createData = await createRes.json();
            return createData.id;
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function showErrorMessage(title, details) {
            alert(`❌ ${title}\n--------------------\n詳細原因：\n${details}`);
        }
    </script>
